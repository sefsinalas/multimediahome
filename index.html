<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08151e">
  <meta name="description" content="Clima y relojes para el monitor de la oficina">
  <title>Oficina · Clima y horas</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2308151e'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='%237de0cd' stroke-width='5'/%3E%3Cpath d='M32 20v13l9 6' fill='none' stroke='%23fff' stroke-linecap='round' stroke-width='5'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, sans-serif; background: #08151e; color: #f5f7f6; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 80% 8%, #163b49 0, transparent 35%), linear-gradient(145deg, #091b27, #07141d 70%); }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .shell { min-height: 100vh; max-width: 1920px; margin: auto; padding: clamp(24px, 3.4vw, 64px); display: flex; flex-direction: column; gap: clamp(32px, 4vh, 52px); }
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
    .eyebrow { margin: 0 0 12px; color: #8bdccf; font-size: clamp(17px, 1.3vw, 23px); font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(44px, 4.5vw, 86px); line-height: 1.05; font-weight: 650; letter-spacing: -.05em; }
    .date { margin-top: 16px; font-size: clamp(21px, 1.8vw, 32px); color: #b8cbd0; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: flex-end; }
    .action { border: 1px solid #446473; background: #183342; color: white; padding: 15px 20px; border-radius: 16px; min-height: 52px; font-size: clamp(16px, 1.1vw, 21px); }
    .action:focus-visible, .city-result:focus-visible { outline: 4px solid #81e7d3; outline-offset: 3px; }
    main { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 28px; flex: 1; }
    .card { background: rgba(17, 40, 53, .78); border: 1px solid #345565; border-radius: 30px; padding: clamp(28px, 2.5vw, 48px); box-shadow: 0 18px 55px rgba(0,0,0,.16); }
    .section-title { margin: 0; color: #a6c5cb; font-size: clamp(20px, 1.35vw, 26px); font-weight: 600; }
    .weather-main { display: flex; align-items: center; gap: 30px; margin-top: 28px; }
    .temperature { font-size: clamp(100px, 10.8vw, 200px); font-weight: 600; line-height: 1; letter-spacing: -.09em; white-space: nowrap; }
    .temperature sup { font-size: .38em; vertical-align: top; margin-left: .05em; letter-spacing: 0; }
    .conditions { font-size: clamp(26px, 2.2vw, 43px); line-height: 1.2; }
    .feels { margin-top: 10px; color: #bfd2d5; font-size: clamp(18px, 1.35vw, 25px); }
    .weather-meta { display: flex; gap: clamp(20px, 2.5vw, 52px); flex-wrap: wrap; border-top: 1px solid #385767; margin-top: 36px; padding-top: 30px; font-size: clamp(19px, 1.4vw, 27px); }
    .weather-meta strong { font-weight: 650; color: #f7f9f8; }
    .weather-meta span { color: #bdd0d3; }
    .forecast { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 36px; }
    .day { border-radius: 18px; background: #193b49; padding: 18px; min-width: 0; }
    .day-name { color: #a9c7cc; font-size: clamp(16px, 1.2vw, 22px); }
    .day-temp { margin-top: 10px; font-size: clamp(23px, 2vw, 38px); font-weight: 650; }
    .clocks { display: flex; flex-direction: column; gap: 18px; }
    .clock-list { display: flex; flex-direction: column; gap: 14px; margin-top: 26px; }
    .clock { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 20px 24px; border-radius: 20px; background: #173744; min-height: 105px; }
    .clock-labels { display: flex; gap: 8px; flex-wrap: wrap; }
    .clock-labels span { color: #b4d4d4; border: 1px solid #517477; padding: 7px 12px; border-radius: 999px; font-size: clamp(17px, 1.2vw, 23px); font-weight: 600; white-space: nowrap; }
    .clock-time { font-size: clamp(39px, 3.8vw, 72px); line-height: 1; letter-spacing: -.06em; font-variant-numeric: tabular-nums; font-weight: 650; white-space: nowrap; }
    .hint { margin-top: auto; padding-top: 12px; color: #8faeb7; font-size: clamp(16px, 1.1vw, 20px); line-height: 1.4; }
    .status { min-height: 26px; color: #9cb8be; font-size: clamp(15px, 1vw, 19px); }
    dialog { color: white; background: #14303e; border: 1px solid #527985; border-radius: 24px; width: min(620px, calc(100vw - 36px)); padding: 28px; box-shadow: 0 30px 100px #0009; }
    dialog::backdrop { background: #000b; }
    dialog h2 { margin: 0 0 18px; font-size: 30px; }
    dialog label { display: block; margin-bottom: 10px; font-size: 18px; }
    dialog input { width: 100%; border: 1px solid #70939b; background: #071d29; color: white; border-radius: 12px; padding: 15px; font-size: 21px; }
    .results { display: grid; gap: 8px; margin-top: 16px; max-height: 330px; overflow-y: auto; }
    .city-result { text-align: left; color: white; background: #205061; border: 1px solid #487281; border-radius: 12px; padding: 13px 16px; font-size: 19px; }
    .dialog-actions { display: flex; justify-content: flex-end; margin-top: 22px; }
    @media (min-width: 721px) and (max-height: 700px) {
      .shell { height: 100vh; min-height: 0; padding: 18px 22px; gap: 14px; }
      header { align-items: center; }
      .eyebrow { margin-bottom: 3px; font-size: 13px; }
      h1 { font-size: 43px; }
      .date { margin-top: 4px; font-size: 17px; }
      .action { min-height: 38px; padding: 7px 12px; border-radius: 10px; font-size: 14px; }
      main { min-height: 0; gap: 14px; }
      .card { min-height: 0; padding: 18px; border-radius: 18px; }
      .section-title { font-size: 18px; }
      .weather-main { gap: 14px; margin-top: 10px; }
      .temperature { font-size: 76px; }
      .conditions { font-size: 22px; }
      .feels { margin-top: 4px; font-size: 15px; }
      .weather-meta { gap: 16px; margin-top: 14px; padding-top: 12px; font-size: 15px; }
      .forecast { gap: 6px; margin-top: 14px; }
      .day { padding: 10px; border-radius: 10px; }
      .day-name { font-size: 13px; }
      .day-temp { margin-top: 5px; font-size: 18px; }
      .status { min-height: 16px; margin-top: 8px; font-size: 11px; }
      .clock-list { gap: 9px; margin-top: 13px; }
      .clock { min-height: 70px; gap: 10px; padding: 10px 12px; border-radius: 12px; }
      .clock-labels span { padding: 4px 7px; font-size: 13px; }
      .clock-time { font-size: 36px; }
      .hint { font-size: 12px; }
    }
    @media (max-width: 720px) { main { grid-template-columns: 1fr; } .shell { min-height: 100svh; } .clocks { min-height: 420px; } }
    @media (max-width: 650px) { header { flex-direction: column; } .actions { justify-content: flex-start; } .weather-main { flex-direction: column; align-items: flex-start; gap: 4px; } .clock { align-items: flex-start; flex-direction: column; } .forecast { grid-template-columns: 1fr 1fr 1fr; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <p class="eyebrow">Tu oficina</p>
        <h1 id="city-title">Salta</h1>
        <div class="date" id="local-date">&nbsp;</div>
      </div>
      <div class="actions">
        <button class="action" id="change-city">Cambiar ciudad</button>
        <button class="action" id="fullscreen">Pantalla completa</button>
      </div>
    </header>
    <main>
      <section class="card" aria-labelledby="weather-heading">
        <h2 class="section-title" id="weather-heading">El clima ahora</h2>
        <div class="weather-main">
          <div class="temperature" id="temperature">—<sup>°C</sup></div>
          <div>
            <div class="conditions" id="conditions">Cargando clima…</div>
            <div class="feels" id="feels"></div>
          </div>
        </div>
        <div class="weather-meta" id="weather-meta"></div>
        <div class="forecast" id="forecast"></div>
        <div class="status" id="status" role="status"></div>
      </section>
      <section class="card clocks" aria-labelledby="clocks-heading">
        <div>
          <h2 class="section-title" id="clocks-heading">Horas del mundo</h2>
          <div class="clock-list" id="clock-list"></div>
        </div>
        <p class="hint">Cancún y EST comparten reloj. Pulsá Home en el control para abrir tus aplicaciones.</p>
      </section>
    </main>
  </div>
  <dialog id="city-dialog">
    <h2>Cambiar ciudad</h2>
    <label for="city-search">Buscá tu ciudad para el clima</label>
    <input id="city-search" autocomplete="off" placeholder="Ciudad, provincia o país">
    <div class="results" id="city-results"></div>
    <div class="dialog-actions"><button class="action" id="close-city">Cerrar</button></div>
  </dialog>
  <script>
    const defaultCity = { name: 'Salta', country: 'Argentina', latitude: -24.7859, longitude: -65.4117, timezone: 'America/Argentina/Salta' };
    let city;
    try { city = JSON.parse(localStorage.getItem('office-city')) || defaultCity; } catch { city = defaultCity; }
    const el = id => document.getElementById(id);
    const weatherNames = { 0:'Despejado', 1:'Mayormente despejado', 2:'Parcialmente nublado', 3:'Nublado', 45:'Niebla', 48:'Niebla', 51:'Llovizna', 53:'Llovizna', 55:'Llovizna', 61:'Lluvia', 63:'Lluvia', 65:'Lluvia intensa', 71:'Nieve', 73:'Nieve', 75:'Nieve', 80:'Chaparrones', 81:'Chaparrones', 82:'Chaparrones fuertes', 95:'Tormenta', 96:'Tormenta', 99:'Tormenta' };
    const formatTime = (date, zone) => new Intl.DateTimeFormat('es-AR', {timeZone:zone, hour:'2-digit', minute:'2-digit', hourCycle:'h23'}).format(date);
    const formatDate = (date, zone) => new Intl.DateTimeFormat('es-AR', {timeZone:zone, weekday:'long', day:'numeric', month:'long'}).format(date);
    function renderTime() {
      const now = new Date();
      el('city-title').textContent = city.name;
      el('local-date').textContent = formatDate(now, city.timezone);
      const zones = [
        {label:'Cancún', zone:'America/Cancun'},
        {label:'EST', zone:'Etc/GMT+5'},
        {label:'CDMX', zone:'America/Mexico_City'}
      ];
      const groups = new Map();
      for (const z of zones) {
        const time = formatTime(now, z.zone);
        if (!groups.has(time)) groups.set(time, []);
        groups.get(time).push(z.label);
      }
      el('clock-list').replaceChildren(...[...groups].map(([time, labels]) => {
        const row = document.createElement('div'); row.className = 'clock';
        const tags = document.createElement('div'); tags.className = 'clock-labels';
        for (const label of labels) { const tag=document.createElement('span'); tag.textContent=label; tags.append(tag); }
        const clock = document.createElement('div'); clock.className='clock-time'; clock.textContent=time;
        row.append(tags, clock); return row;
      }));
    }
    async function renderWeather() {
      const currentCity = city;
      const url = new URL('https://api.open-meteo.com/v1/forecast');
      url.search = new URLSearchParams({ latitude:city.latitude, longitude:city.longitude, current:'temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m', daily:'temperature_2m_max,temperature_2m_min,weather_code', temperature_unit:'celsius', wind_speed_unit:'kmh', timezone:city.timezone, forecast_days:'3' });
      el('status').textContent = 'Actualizando…';
      try {
        const response = await fetch(url, {cache:'no-store'});
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = await response.json();
        if (city !== currentCity) return;
        const c = data.current;
        el('temperature').innerHTML = `${Math.round(c.temperature_2m)}<sup>°C</sup>`;
        el('conditions').textContent = weatherNames[c.weather_code] || 'Estado variable';
        el('feels').textContent = `Sensación ${Math.round(c.apparent_temperature)} °C`;
        el('weather-meta').innerHTML = `<div><strong>${Math.round(c.relative_humidity_2m)}%</strong> <span>humedad</span></div><div><strong>${Math.round(c.wind_speed_10m)} km/h</strong> <span>viento</span></div>`;
        el('forecast').replaceChildren(...data.daily.time.map((date, index) => {
          const day=document.createElement('div'); day.className='day';
          const name=document.createElement('div'); name.className='day-name';
          name.textContent = index === 0 ? 'Hoy' : new Intl.DateTimeFormat('es-AR',{weekday:'long',timeZone:city.timezone}).format(new Date(date+'T12:00:00'));
          const temp=document.createElement('div'); temp.className='day-temp'; temp.textContent=`${Math.round(data.daily.temperature_2m_max[index])}° / ${Math.round(data.daily.temperature_2m_min[index])}°`;
          day.append(name,temp); return day;
        }));
        el('status').textContent = `Actualizado ${formatTime(new Date(), city.timezone)} · Open-Meteo`;
      } catch {
        el('conditions').textContent = 'Clima no disponible';
        el('status').textContent = 'Reintentaremos automáticamente.';
      }
    }
    el('change-city').addEventListener('click', () => { el('city-dialog').showModal(); el('city-search').focus(); });
    el('close-city').addEventListener('click', () => el('city-dialog').close());
    el('fullscreen').addEventListener('click', () => document.documentElement.requestFullscreen?.());
    let searchTimer;
    el('city-search').addEventListener('input', () => {
      clearTimeout(searchTimer);
      const name = el('city-search').value.trim();
      if (name.length < 2) { el('city-results').textContent=''; return; }
      searchTimer=setTimeout(async () => {
        el('city-results').textContent='Buscando…';
        try {
          const response=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=5&language=es`);
          const data=await response.json();
          if (el('city-search').value.trim() !== name) return;
          el('city-results').replaceChildren(...(data.results || []).map(result => {
            const button=document.createElement('button'); button.className='city-result';
            button.textContent=[result.name,result.admin1,result.country].filter(Boolean).join(', ');
            button.addEventListener('click', () => {
              city={name:result.name,country:result.country,latitude:result.latitude,longitude:result.longitude,timezone:result.timezone};
              localStorage.setItem('office-city',JSON.stringify(city));
              el('city-dialog').close(); renderTime(); renderWeather();
            });
            return button;
          }));
          if (!data.results?.length) el('city-results').textContent='No encontré esa ciudad.';
        } catch { el('city-results').textContent='No se pudo buscar. Probá de nuevo.'; }
      },400);
    });
    renderTime(); renderWeather();
    setInterval(renderTime, 15000);
    setInterval(renderWeather, 15*60*1000);
  </script>
</body>
</html>
